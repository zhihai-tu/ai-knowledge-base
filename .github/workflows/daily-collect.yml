name: Daily Collect

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt

      - name: Run collection pipeline
        run: |
          cd v2
          python pipeline/pipeline.py --sources github,rss --limit 10 --verbose

      - name: Validate JSON
        run: |
          cd v2
          python hooks/validate_json.py knowledge/articles/*.json

      - name: Check quality
        run: |
          cd v2
          python hooks/check_quality.py knowledge/articles/*.json

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new data, skipping commit"
            exit 0
          fi
          count=$(git status --porcelain -- 'v2/knowledge/articles/*.json' | grep -c 'json$' || true)
          date=$(date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/
          git commit -m "chore(v2): collect ${count} articles on ${date}"
          git push